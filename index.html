*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.frame{position:absolute;left:50%;top:50%;translate:-50% -50%}

/* desktop: background halves pinned to the left and right edges at height scale (--h), so the decor at
   the edges is never cropped; the centre of the art is black, so the halves meet or overlap without a seam.
   Content scale --c shrinks on narrower screens to keep clear of the stones. Positions are frame px around y=480. */
.d{position:fixed;inset:0;--h:calc(100dvh / 960);--c:min(var(--h),calc(100vw / 1700))}
.d .half{position:absolute;top:0;width:calc(var(--h) * 960);height:100dvh;background:center/100% 100% no-repeat;mix-blend-mode:lighten}
.d .half--l{left:0;background-image:url("2 бок.webp")}
.d .half--r{right:0;background-image:url("1 бок.webp")}
.d .logo{position:absolute;left:50%;top:calc(50dvh + var(--c) * -392);width:calc(var(--c) * 584);height:auto;translate:-50% 0}
.d h1{position:absolute;left:0;right:0;top:calc(50dvh + var(--c) * (457 - 480));margin:0;padding-left:.1em;
